[project]
name = "langgraph-playground"
version = "0.1.0"
description = "Zero-to-hero teaching curriculum for LangChain and LangGraph (2026 stack)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "LangGraph Playground" }]

dependencies = [
  # --- LangChain core (v1.x) ---
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-classic>=1.0",
  "langchain-community>=0.3",
  "langchain-text-splitters>=0.3",

  # --- Model providers (both kept; switch via LLM_PROVIDER env var) ---
  "langchain-anthropic>=0.3",
  "langchain-openai>=0.3",

  # --- LangGraph (v1.x) + ecosystem ---
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "langgraph-supervisor>=0.0.20",
  "langgraph-swarm>=0.0.10",

  # --- RAG stack ---
  "langchain-chroma>=0.2",
  "chromadb>=0.5",
  "fastembed>=0.4",              # local CPU embeddings — no extra API key needed
  "pypdf>=4.0",                  # PDF parser — lesson 20
  "dateparser>=1.2",             # multilingual / relative-date parser — lesson 21
  "babel>=2.17",                 # CLDR locale-aware date formatting — lesson 23
  "jdatetime>=5.0",              # Persian Jalali calendar — lesson 23
  "hijridate>=2.3",              # Islamic Hijri calendar (hijri-converter successor) — lesson 23
  "text2num>=3.0",               # spoken-number → digit, EU langs (no TR) — lesson 24
  "num2words>=0.5",              # int → spoken-number (round-trip test generator) — lesson 24
  "rapidfuzz>=3.10",             # typo-tolerant token matching for lesson 24's fuzzy parser

  # --- Web search tool for capstones ---
  "tavily-python>=0.5",

  # --- Tier 6 production ---
  "jinja2>=3.1",                 # dynamic prompting — lesson 28, capstones
  "tenacity>=9.0",               # retry/backoff — lesson 30
  "redis>=5.2",                  # distributed locks — lesson 31, rag_qa_api_pro

  # --- App / config / DX ---
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "ipdb>=0.13.13",               # taught in lesson 03, used throughout
]

[project.optional-dependencies]
api = [
  # Used by projects/rag_qa_api/ and projects/rag_qa_api_pro/
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "langgraph-checkpoint-postgres>=2.0.0",
  "psycopg[binary,pool]>=3.2",
  # Vector-DB choices — lesson 29 + rag_qa_api_pro
  "langchain-postgres>=0.0.12",
  "langchain-qdrant>=0.2",
  "qdrant-client>=1.12",
]
ml = [
  # Used by ml_foundations/ and lesson 33 — kept separate so the core
  # LangGraph install stays slim.
  "tokenizers>=0.20",
  "sentencepiece>=0.2",
  "tiktoken>=0.8",
  "gensim>=4.3",
  "torch>=2.4",
  "transformers>=4.45",
  "datasets>=3.0",
  "sentence-transformers>=3.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "faiss-cpu>=1.9",              # lesson 33 — algorithm comparison
  "peft>=0.13",                  # ml_foundations/06 — LoRA adapters
  "trl>=0.11",                   # ml_foundations/06 — SFT/DPO trainers
  "pillow>=10.0",                # lesson 37 — multimodal images
]
eval = [
  # Lesson 35 — evaluation discipline
  "deepeval>=1.0",
  "ragas>=0.2",
]
obs = [
  # Lesson 34 — observability + tracing
  "langfuse>=2.50",
  "traceloop-sdk>=0.40",
  "arize-phoenix>=5.0",
]
landscape = [
  # Lesson 36 — opt-in extras for the library-landscape demos.
  # Pick and choose: `uv sync --extra landscape` installs them all; or
  # `uv add instructor` for just one.
  "instructor>=1.6",
  "marvin>=2.3",
  "litellm>=1.50",
  "pydantic-ai>=0.0.13",
  "semantic-router>=0.0.65",
  "dspy>=2.5",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "lessons", "projects", "ml_foundations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
