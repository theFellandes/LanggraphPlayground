[project]
name = "langgraph-playground"
version = "0.1.0"
description = "Zero-to-hero teaching curriculum for LangChain and LangGraph (2026 stack)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "LangGraph Playground" }]

dependencies = [
  # --- LangChain core (v1.x) ---
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-classic>=1.0",
  "langchain-community>=0.3",
  "langchain-text-splitters>=0.3",

  # --- Model providers (both kept; switch via LLM_PROVIDER env var) ---
  "langchain-anthropic>=0.3",
  "langchain-openai>=0.3",

  # --- LangGraph (v1.x) + ecosystem ---
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "langgraph-supervisor>=0.0.20",
  "langgraph-swarm>=0.0.10",

  # --- RAG stack ---
  "langchain-chroma>=0.2",
  "chromadb>=0.5",
  "fastembed>=0.4",              # local CPU embeddings — no extra API key needed
  "pypdf>=4.0",                  # PDF parser — lesson 20

  # --- Web search tool for capstones ---
  "tavily-python>=0.5",

  # --- App / config / DX ---
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "ipdb>=0.13.13",               # taught in lesson 03, used throughout
]

[project.optional-dependencies]
api = [
  # Used by projects/rag_qa_api/
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "langgraph-checkpoint-postgres>=2.0.0",
  "psycopg[binary,pool]>=3.2",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "lessons", "projects"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
