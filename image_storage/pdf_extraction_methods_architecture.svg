<svg viewBox="0 0 880 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">PDF to Markdown: seven extraction methods and the image lifecycle</title>
  <desc id="dsc">A ladder of seven PDF extraction methods from cheap local text-layer reading up to LLM-driven hybrid, agentic and two-pass verification, each annotated with what happens to an embedded figure; below, the figure lifecycle from extract through caption, store, reference, embed, metadata, index and cite.</desc>
  <style>
    .title{font:600 18px Georgia,'Times New Roman',serif;fill:#1f1d1b;}
    .sub{font:12px ui-sans-serif,system-ui,Arial,sans-serif;fill:#6b6660;}
    .name{font:600 13.5px ui-sans-serif,system-ui,Arial,sans-serif;fill:#1f1d1b;}
    .pipe{font:11.5px ui-sans-serif,system-ui,Arial,sans-serif;fill:#6b6660;}
    .fate{font:italic 11px ui-sans-serif,system-ui,Arial,sans-serif;fill:#6b6660;}
    .num{font:700 13px ui-sans-serif,system-ui,Arial,sans-serif;fill:#fff;}
    .leg{font:11px ui-sans-serif,system-ui,Arial,sans-serif;fill:#6b6660;}
    .panel{font:600 12.5px ui-sans-serif,system-ui,Arial,sans-serif;fill:#1f1d1b;}
    .chip{font:600 11px ui-sans-serif,system-ui,Arial,sans-serif;fill:#1f1d1b;}
    .chipsub{font:9.5px ui-sans-serif,system-ui,Arial,sans-serif;fill:#6b6660;}
    .note{font:11px ui-sans-serif,system-ui,Arial,sans-serif;fill:#6b6660;}
    .arrow{font:13px ui-sans-serif,system-ui,Arial,sans-serif;fill:#9b948c;}
  </style>

  <rect x="0" y="0" width="880" height="690" fill="#fbfaf8"/>
  <rect x="0.5" y="0.5" width="879" height="689" fill="none" stroke="#e7e3dd"/>

  <!-- header -->
  <text class="title" x="36" y="30">PDF &#8594; Markdown &#8212; 7 extraction methods + the image lifecycle</text>
  <text class="sub" x="36" y="50">Top &#8594; bottom = rising cost &amp; capability. Climb only as high as the page actually demands.</text>

  <!-- legend -->
  <circle cx="556" cy="26" r="6" fill="#3a8f86"/>
  <text class="leg" x="568" y="30">cool = local / offline</text>
  <circle cx="700" cy="26" r="6" fill="#c4743c"/>
  <text class="leg" x="712" y="30">warm = calls the VLM (get_llm)</text>

  <!-- ===== method ladder ===== -->
  <!-- row 1 -->
  <rect x="36" y="68" width="808" height="44" rx="8" fill="#f4f2ef" stroke="#e3ded7"/>
  <rect x="36" y="68" width="5" height="44" rx="2" fill="#2f9e6e"/>
  <circle cx="64" cy="90" r="14" fill="#2f9e6e"/><text class="num" x="64" y="94.5" text-anchor="middle">1</text>
  <text class="name" x="90" y="86">Text-layer extraction</text>
  <text class="pipe" x="90" y="103">glyph stream &#8594; Markdown &#8212; no render, no OCR</text>
  <text class="fate" x="836" y="94" text-anchor="end">image &#8594; bbox only &#183; pixels dropped</text>
  <!-- row 2 -->
  <rect x="36" y="116" width="808" height="44" rx="8" fill="#f4f2ef" stroke="#e3ded7"/>
  <rect x="36" y="116" width="5" height="44" rx="2" fill="#3a8f86"/>
  <circle cx="64" cy="138" r="14" fill="#3a8f86"/><text class="num" x="64" y="142.5" text-anchor="middle">2</text>
  <text class="name" x="90" y="134">Classical OCR + layout</text>
  <text class="pipe" x="90" y="151">rasterize &#8594; detect regions &#8594; OCR &#8594; reassemble</text>
  <text class="fate" x="836" y="142" text-anchor="end">image &#8594; region crop &#183; no semantics</text>
  <!-- row 3 -->
  <rect x="36" y="164" width="808" height="44" rx="8" fill="#f4f2ef" stroke="#e3ded7"/>
  <rect x="36" y="164" width="5" height="44" rx="2" fill="#4a7fae"/>
  <circle cx="64" cy="186" r="14" fill="#4a7fae"/><text class="num" x="64" y="190.5" text-anchor="middle">3</text>
  <text class="name" x="90" y="182">Specialised doc-VLM <tspan class="pipe">(local, OCR-free)</tspan></text>
  <text class="pipe" x="90" y="199">page image &#8594; DocTags &#8594; Markdown</text>
  <text class="fate" x="836" y="190" text-anchor="end">image &#8594; real figure crops kept</text>
  <!-- row 4 -->
  <rect x="36" y="212" width="808" height="44" rx="8" fill="#f4f2ef" stroke="#e3ded7"/>
  <rect x="36" y="212" width="5" height="44" rx="2" fill="#d18a2e"/>
  <circle cx="64" cy="234" r="14" fill="#d18a2e"/><text class="num" x="64" y="238.5" text-anchor="middle">4</text>
  <text class="name" x="90" y="230">Frontier VLM-direct</text>
  <text class="pipe" x="90" y="247">render page &#8594; prompt VLM &#8594; Markdown</text>
  <text class="fate" x="836" y="238" text-anchor="end">image &#8594; described in prose &#183; no file</text>
  <!-- row 5 -->
  <rect x="36" y="260" width="808" height="44" rx="8" fill="#f4f2ef" stroke="#e3ded7"/>
  <rect x="36" y="260" width="5" height="44" rx="2" fill="#c4743c"/>
  <circle cx="64" cy="282" r="14" fill="#c4743c"/><text class="num" x="64" y="286.5" text-anchor="middle">5</text>
  <text class="name" x="90" y="278">Hybrid region-routing <tspan class="pipe">&#9733; production default</tspan></text>
  <text class="pipe" x="90" y="295">route each region &#8594; cheapest extractor that wins</text>
  <text class="fate" x="836" y="286" text-anchor="end">image &#8594; VLM-captioned crop + bbox</text>
  <!-- row 6 -->
  <rect x="36" y="308" width="808" height="44" rx="8" fill="#f4f2ef" stroke="#e3ded7"/>
  <rect x="36" y="308" width="5" height="44" rx="2" fill="#b85d50"/>
  <circle cx="64" cy="330" r="14" fill="#b85d50"/><text class="num" x="64" y="334.5" text-anchor="middle">6</text>
  <text class="name" x="90" y="326">Agentic (LangGraph)</text>
  <text class="pipe" x="90" y="343">fan-out per page &#8594; self-check &#8594; retry weak pages</text>
  <text class="fate" x="836" y="334" text-anchor="end">image &#8594; per-page &#183; audited</text>
  <!-- row 7 -->
  <rect x="36" y="356" width="808" height="44" rx="8" fill="#f4f2ef" stroke="#e3ded7"/>
  <rect x="36" y="356" width="5" height="44" rx="2" fill="#a94a55"/>
  <circle cx="64" cy="378" r="14" fill="#a94a55"/><text class="num" x="64" y="382.5" text-anchor="middle">7</text>
  <text class="name" x="90" y="374">Two-pass / verification</text>
  <text class="pipe" x="90" y="391">draft &#8594; 2nd VLM judges draft vs page image</text>
  <text class="fate" x="836" y="382" text-anchor="end">image &#8594; caption verified vs pixels</text>

  <!-- ===== image lifecycle ===== -->
  <rect x="36" y="420" width="808" height="234" rx="10" fill="#f6f4f1" stroke="#e3ded7"/>
  <text class="panel" x="56" y="448">The image lifecycle &#8212; what happens to a figure after the model sees it</text>
  <text class="note" x="56" y="468">The user's core question. Methods 4&#8211;7 send the figure through this; methods 1&#8211;3 stop earlier (see fates above).</text>

  <!-- chips -->
  <rect x="56" y="502" width="82" height="38" rx="7" fill="#ffffff" stroke="#d8d4ce"/>
  <text class="chip" x="97" y="520" text-anchor="middle">Extract</text><text class="chipsub" x="97" y="533" text-anchor="middle">3 ways</text>
  <text class="arrow" x="146" y="525" text-anchor="middle">&#8594;</text>
  <rect x="154" y="502" width="82" height="38" rx="7" fill="#fdf6ec" stroke="#d18a2e" stroke-width="1.5"/>
  <text class="chip" x="195" y="520" text-anchor="middle">Caption</text><text class="chipsub" x="195" y="533" text-anchor="middle">via VLM</text>
  <text class="arrow" x="244" y="525" text-anchor="middle">&#8594;</text>
  <rect x="252" y="502" width="82" height="38" rx="7" fill="#ffffff" stroke="#d8d4ce"/>
  <text class="chip" x="293" y="520" text-anchor="middle">Store</text><text class="chipsub" x="293" y="533" text-anchor="middle">PNG bytes</text>
  <text class="arrow" x="342" y="525" text-anchor="middle">&#8594;</text>
  <rect x="350" y="502" width="82" height="38" rx="7" fill="#ffffff" stroke="#d8d4ce"/>
  <text class="chip" x="391" y="520" text-anchor="middle">Reference</text><text class="chipsub" x="391" y="533" text-anchor="middle">![cap](path)</text>
  <text class="arrow" x="440" y="525" text-anchor="middle">&#8594;</text>
  <rect x="448" y="502" width="82" height="38" rx="7" fill="#ffffff" stroke="#d8d4ce"/>
  <text class="chip" x="489" y="520" text-anchor="middle">Embed</text><text class="chipsub" x="489" y="533" text-anchor="middle">caption</text>
  <text class="arrow" x="538" y="525" text-anchor="middle">&#8594;</text>
  <rect x="546" y="502" width="82" height="38" rx="7" fill="#ffffff" stroke="#d8d4ce"/>
  <text class="chip" x="587" y="520" text-anchor="middle">Metadata</text><text class="chipsub" x="587" y="533" text-anchor="middle">+ bbox</text>
  <text class="arrow" x="636" y="525" text-anchor="middle">&#8594;</text>
  <rect x="644" y="502" width="82" height="38" rx="7" fill="#ffffff" stroke="#d8d4ce"/>
  <text class="chip" x="685" y="520" text-anchor="middle">Index</text><text class="chipsub" x="685" y="533" text-anchor="middle">vector</text>
  <text class="arrow" x="734" y="525" text-anchor="middle">&#8594;</text>
  <rect x="742" y="502" width="82" height="38" rx="7" fill="#ffffff" stroke="#d8d4ce"/>
  <text class="chip" x="783" y="520" text-anchor="middle">Cite</text><text class="chipsub" x="783" y="533" text-anchor="middle">on retrieval</text>

  <text class="note" x="56" y="576">Extract 3 ways:  embedded XObject  &#183;  clipped page render  &#183;  parser (Docling) crop</text>
  <text class="note" x="56" y="596">The caption + bbox ride on the chunk as metadata &#8212; so a text-only RAG can retrieve and cite the figure.</text>
  <text class="note" x="56" y="616">Wiring: the VLM step is always <tspan style="font-family:ui-monospace,'Courier New',monospace;fill:#1f1d1b">get_llm("google", &#8230;)</tspan> &#8212; never a raw SDK. Demo: demos/image_lifecycle.py</text>
  <text class="note" x="56" y="636">Each rung has a runnable demo &#8594; projects/vlm_extraction_harness/demos/m1&#8230;m7 + image_lifecycle.py</text>
</svg>
